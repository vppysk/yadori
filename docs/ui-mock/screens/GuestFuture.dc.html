</head>

<x-dc>
<helmet>

<style>
body{margin:0;font-family:"Zen Kaku Gothic New",sans-serif;background:#F5F3EE;color:#1D2528}
a{color:#1F5C5A}a:hover{color:#153F3E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F3EE; font-family: 'Zen Kaku Gothic New', sans-serif; color: #1D2528; overflow: hidden">
  <header style="padding: 20px 20px 14px; background: #FFFFFF; border-bottom: 1px solid #E2DED6; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-family: 'Shippori Mincho B1', serif; font-size: 20px; font-weight: 600; letter-spacing: 0.04em">[ホテル名]</div>
      <a href="#" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid #E2DED6; border-radius: 22px; font-size: 13px; font-weight: 500; text-decoration: none; color: #1D2528">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
        スタッフと話す
      </a>
    </div>
    <div style="display: flex; gap: 8px; font-size: 12px; color: #5B6468">
      <span style="padding: 4px 10px; background: #EFECE6; border-radius: 12px">ご予約 2名・和洋室</span>
      <span style="padding: 4px 10px; background: #E3EEEC; color: #1F5C5A; border-radius: 12px; font-weight: 500">10/28（水）〜 10/30（金）</span>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="align-self: center; font-size: 11px; color: #5B6468">本日 14:05 ・ ご到着の34日前</div>

    <div style="align-self: flex-end; max-width: 78%; padding: 12px 14px; background: #1F5C5A; color: #FFFFFF; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.6">レストランのランチは何時からですか？</div>

    <div style="align-self: flex-start; max-width: 88%; display: flex; flex-direction: column; gap: 8px">
      <div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.7">ご滞在の10月28日〜30日は冬季営業期間のため、<strong>ランチ営業はお休み</strong>です。ディナーは17:30〜21:00（L.O. 20:30）でご案内しています。</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; color: #1F5C5A">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
        ご滞在日の情報で回答 ・ 冬季営業（10/15〜3/31）
      </div>
    </div>

    <div style="align-self: flex-start; width: 88%; box-sizing: border-box; padding: 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700">ディナーのご予約はいかがですか？</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="min-height: 44px; border: 1px solid #D8D3CA; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1D2528">10/28</button>
        <button type="button" style="min-height: 44px; border: 1px solid #D8D3CA; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1D2528">10/29</button>
        <button type="button" style="min-height: 44px; border: 1px solid #D8D3CA; border-radius: 10px; background: #FFFFFF; font: inherit; font-size: 13px; color: #1D2528">両日</button>
      </div>
      <div style="font-size: 12px; color: #5B6468; line-height: 1.6">ご予約の確定前に、内容を確認させていただきます。</div>
    </div>
  </main>

  <div style="padding: 0 16px 10px; display: flex; gap: 8px; overflow: hidden">
    <button type="button" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 22px; font: inherit; font-size: 13px; color: #1D2528">アクセス</button>
    <button type="button" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 22px; font: inherit; font-size: 13px; color: #1D2528">チェックイン時間</button>
    <button type="button" style="flex-shrink: 0; min-height: 44px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 22px; font: inherit; font-size: 13px; color: #1D2528">周辺の観光</button>
  </div>

  <form style="margin: 0; padding: 10px 16px 28px; background: #FFFFFF; border-top: 1px solid #E2DED6; display: flex; gap: 8px; align-items: center">
    <label for="guest-msg2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">メッセージ</label>
    <input id="guest-msg2" type="text" placeholder="ご質問・ご依頼をどうぞ" style="flex-grow: 1; min-height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D8D3CA; border-radius: 22px; background: #F5F3EE; font: inherit; font-size: 15px; color: #1D2528">
    <button type="button" aria-label="送信" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #1F5C5A; color: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>
  </form>
</div>
</x-dc>
