<body>
<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F5F3EE; font-family: 'Zen Kaku Gothic New', sans-serif; color: #1D2528; overflow: hidden">
  <header style="padding: 20px 20px 16px; background: #1D2528; color: #F5F3EE; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">AIに相談</h1>
    <span style="font-size: 12px; color: #C9CFD1">館内ルール・マニュアル・特記事項</span>
  </header>

  <main style="flex-grow: 1; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="align-self: flex-end; max-width: 80%; padding: 12px 14px; background: #1D2528; color: #FFFFFF; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.6">連泊で清掃不要の札が出ている部屋から、タオル交換だけ頼まれた。入室していい？</div>
    <div style="align-self: flex-start; max-width: 90%; display: flex; flex-direction: column; gap: 8px">
      <div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.7">入室はせず、ドア前でお渡しするのがルールです。不在の場合はドアノブ用の袋に入れて掛け、オーダーを「届けた」にしてください。</div>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <span style="padding: 4px 10px; background: #E3EEEC; color: #1F5C5A; border-radius: 12px; font-size: 11px">清掃マニュアル「連泊対応」</span>
        <span style="padding: 4px 10px; background: #E3EEEC; color: #1F5C5A; border-radius: 12px; font-size: 11px">更新 8/12</span>
      </div>
    </div>
    <div style="align-self: flex-end; max-width: 80%; padding: 12px 14px; background: #1D2528; color: #FFFFFF; border-radius: 16px 16px 4px 16px; font-size: 15px; line-height: 1.6">今日、男湯は使える？</div>
    <div style="align-self: flex-start; max-width: 90%; display: flex; flex-direction: column; gap: 8px">
      <div style="padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2DED6; border-radius: 16px 16px 16px 4px; font-size: 15px; line-height: 1.7">本日は給湯トラブルのため<strong>17:00まで利用停止</strong>です。女湯は通常どおりです。</div>
      <span style="align-self: flex-start; padding: 4px 10px; background: #F7ECDC; color: #9A5B0B; border-radius: 12px; font-size: 11px">大浴場の特記事項（14:52 更新）</span>
    </div>
  </main>

  <form style="margin: 0; padding: 10px 16px; background: #FFFFFF; border-top: 1px solid #E2DED6; display: flex; gap: 8px; align-items: center">
    <label for="s-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">質問</label>
    <input id="s-msg" type="text" placeholder="わからないことを聞く" style="flex-grow: 1; min-height: 44px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D8D3CA; border-radius: 22px; background: #F5F3EE; font: inherit; font-size: 15px; color: #1D2528">
    <button type="button" aria-label="送信" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #1D2528; color: #FFFFFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>
  </form>

  <nav aria-label="スタッフメニュー" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 8px 24px; background: #FFFFFF; border-top: 1px solid #E2DED6">
    <a href="StaffOrders.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6468; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M8 9h8"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>オーダー</a>
    <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #1F5C5A; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>AIに相談</a>
    <a href="#" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5B6468; font-size: 11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg>通知</a>
  </nav>
</div>

</html>
